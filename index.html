<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الاختبارات والتلخيص الذكية | AI Exam Studio Pro</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- PDF.js for extraction -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <!-- MarkedJS for Markdown rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap');
        body { font-family: 'Cairo', sans-serif; }
        .glass-panel { background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(12px); }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-12 flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-slate-800/90 border-b border-slate-700 p-4 sticky top-0 z-50 backdrop-blur-md">
        <div class="max-w-7xl mx-auto flex flex-wrap justify-between items-center gap-4">
            <h1 class="text-xl font-extrabold text-indigo-400 flex items-center gap-2">
                <i class="fa-solid fa-brain text-2xl text-indigo-500 animate-pulse"></i> منصة الاختبارات والتلخيص الذكية Pro
            </h1>
            <div class="flex items-center gap-2 w-full sm:w-auto">
                <div class="relative flex-1 sm:flex-none">
                    <input type="password" id="apiKey" placeholder="ادخل Gemini API Key" class="bg-slate-700/80 text-xs text-white px-3 py-2 rounded-lg border border-slate-600 focus:outline-none focus:border-indigo-500 w-full sm:w-64 pl-8">
                    <button onclick="toggleKeyVisibility()" class="absolute left-2 top-2 text-slate-400 hover:text-white text-xs"><i id="keyEye" class="fa-solid fa-eye"></i></button>
                </div>
                <button onclick="saveApiKey()" class="text-xs bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-2 rounded-lg font-bold transition flex items-center gap-1">
                    <i class="fa-solid fa-floppy-disk"></i> حفظ
                </button>
                <a href="https://aistudio.google.com/app/apikey" target="_blank" class="text-xs bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-2 rounded-lg font-bold transition">مفتاح جديد</a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto p-4 grid grid-cols-1 lg:grid-cols-12 gap-6 mt-2 flex-grow w-full">

        <!-- Controls Side Panel -->
        <div class="lg:col-span-4 bg-slate-800/60 p-5 rounded-2xl border border-slate-700/80 space-y-5 h-fit shadow-xl">
            
            <!-- PDF Upload -->
            <div class="bg-slate-800 p-3 rounded-xl border border-slate-700">
                <label class="block text-xs font-bold mb-2 text-indigo-300 flex items-center justify-between">
                    <span><i class="fa-solid fa-file-pdf ml-1"></i> 1. رفع ملف PDF:</span>
                    <span id="pageCountBadge" class="text-[10px] bg-slate-700 text-slate-300 px-2 py-0.5 rounded-full hidden"></span>
                </label>
                <input type="file" id="pdfInput" accept="application/pdf" onchange="handleFileSelect()" class="block w-full text-xs text-slate-400 file:mr-4 file:py-2 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-700 cursor-pointer">
                <div id="pdfStatus" class="text-xs text-emerald-400 mt-2 hidden font-semibold flex items-center gap-1"></div>
            </div>

            <!-- Page Selection -->
            <div class="grid grid-cols-2 gap-3 bg-slate-800 p-3 rounded-xl border border-slate-700">
                <div>
                    <label class="block text-xs font-semibold mb-1 text-slate-300">من صفحة:</label>
                    <input type="number" id="startPage" value="1" min="1" class="w-full bg-slate-700 p-2 rounded-lg text-sm text-center border border-slate-600 focus:border-indigo-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold mb-1 text-slate-300">إلى صفحة:</label>
                    <input type="number" id="endPage" value="10" min="1" class="w-full bg-slate-700 p-2 rounded-lg text-sm text-center border border-slate-600 focus:border-indigo-500 focus:outline-none">
                </div>
            </div>

            <!-- Options -->
            <div class="space-y-3 bg-slate-800 p-3 rounded-xl border border-slate-700">
                <label class="block text-xs font-bold text-indigo-300"><i class="fa-solid fa-sliders ml-1"></i> 2. إعدادات الاختبار والطلب:</label>
                
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">عدد الأسئلة:</label>
                        <input type="number" id="qCount" value="10" min="1" max="50" class="w-full bg-slate-700 p-2 rounded-lg text-sm text-center border border-slate-600">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">الصعوبة:</label>
                        <select id="difficulty" class="w-full bg-slate-700 p-2 rounded-lg text-sm text-slate-200 border border-slate-600">
                            <option value="متدرج من السهل إلى الصعب">متدرج</option>
                            <option value="سهل">سهل</option>
                            <option value="متوسط">متوسط</option>
                            <option value="صعب جداً للعباقرة">صعب جداً</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs text-slate-400 mb-1">نوع الأسئلة:</label>
                    <select id="qType" class="w-full bg-slate-700 p-2 rounded-lg text-sm text-slate-200 border border-slate-600">
                        <option value="mcq">اختيار من متعدد (MCQ)</option>
                        <option value="essay">أسئلة مقالية وتحليلية</option>
                    </select>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="space-y-2">
                <button onclick="generateExam()" class="w-full bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-700 hover:to-teal-700 text-white font-bold py-2.5 rounded-xl transition flex items-center justify-center gap-2 shadow-lg">
                    <i class="fa-solid fa-file-pen"></i> إنشاء اختبار تفاعلي
                </button>
                <button onclick="generateSummary()" class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 text-white font-bold py-2.5 rounded-xl transition flex items-center justify-center gap-2 shadow-lg">
                    <i class="fa-solid fa-list-check"></i> تلخيص وتقسيم الدروس
                </button>
            </div>

            <!-- Custom AI Prompt -->
            <div class="bg-slate-800 p-3 rounded-xl border border-slate-700">
                <label class="block text-xs text-slate-300 mb-1 font-semibold"><i class="fa-solid fa-comments ml-1"></i> سؤال مباشر للمستند:</label>
                <div class="flex gap-2">
                    <input type="text" id="customPrompt" placeholder="مثال: اشرح النقاط الرئيسية في الصفحة..." class="flex-1 bg-slate-700 p-2 rounded-lg text-xs text-white border border-slate-600 focus:outline-none focus:border-purple-500">
                    <button onclick="askCustomAI()" class="bg-purple-600 hover:bg-purple-700 px-3 py-2 rounded-lg text-xs font-bold transition"><i class="fa-solid fa-paper-plane"></i></button>
                </div>
            </div>

        </div>

        <!-- Main Workspace -->
        <div class="lg:col-span-8 bg-slate-800/60 p-6 rounded-2xl border border-slate-700/80 min-h-[500px] flex flex-col justify-between shadow-xl relative">
            
            <div>
                <!-- Top Toolbar for Output -->
                <div id="outputToolbar" class="hidden flex flex-wrap justify-between items-center pb-4 mb-4 border-b border-slate-700 gap-2">
                    <div id="quizScoreBadge" class="text-xs font-bold bg-indigo-900/60 text-indigo-300 px-3 py-1.5 rounded-lg border border-indigo-700 hidden">
                        <i class="fa-solid fa-trophy text-amber-400 ml-1"></i> النتيجة: <span id="scoreText">0 / 0</span>
                    </div>
                    <div class="flex items-center gap-2 mr-auto">
                        <button onclick="printOutput()" class="text-xs bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-lg transition text-slate-200"><i class="fa-solid fa-print ml-1"></i> طباعة / PDF</button>
                        <button onclick="resetWorkspace()" class="text-xs bg-slate-700 hover:bg-rose-900/50 hover:text-rose-300 px-3 py-1.5 rounded-lg transition text-slate-200"><i class="fa-solid fa-rotate-right ml-1"></i> إعادة مسح</button>
                    </div>
                </div>

                <!-- Loading Spinner -->
                <div id="loader" class="hidden flex-col items-center justify-center py-20">
                    <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-500 mb-4"></div>
                    <p class="text-indigo-300 text-sm animate-pulse font-semibold" id="loadingText">جاري المعالجة واستخراج البيانات...</p>
                </div>

                <!-- Empty State -->
                <div id="emptyState" class="text-center py-24 text-slate-500">
                    <i class="fa-solid fa-file-pdf text-7xl mb-4 text-slate-700 animate-bounce"></i>
                    <p class="text-lg font-semibold text-slate-400">قم برفع كتابك واختيار الصفحات للبدء في إنتاج الاختبارات والملخصات</p>
                    <p class="text-xs text-slate-600 mt-1">يتم الحفظ والتنفيذ بالكامل داخل متصفحك بأمان</p>
                </div>

                <!-- Content Render Area -->
                <div id="outputArea" class="space-y-6 hidden"></div>
            </div>

        </div>

    </main>

    <!-- Footer -->
    <footer class="text-center py-4 text-xs text-slate-500 border-t border-slate-800">
        منصة الاختبارات والتلخيص الذكية &copy; 2026 - تعمل بواسطة نماذج Gemini الفائقة
    </footer>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        let currentExamData = [];
        let userAnswers = {};

        // Auto Load Saved API Key
        window.addEventListener('DOMContentLoaded', () => {
            const savedKey = localStorage.getItem('gemini_api_key');
            if (savedKey) {
                document.getElementById('apiKey').value = savedKey;
            }
        });

        function saveApiKey() {
            const key = document.getElementById('apiKey').value.trim();
            if (key) {
                localStorage.setItem('gemini_api_key', key);
                alert("تم حفظ المفتاح في متصفحك بنجاح!");
            }
        }

        function toggleKeyVisibility() {
            const keyInput = document.getElementById('apiKey');
            const eyeIcon = document.getElementById('keyEye');
            if (keyInput.type === 'password') {
                keyInput.type = 'text';
                eyeIcon.className = 'fa-solid fa-eye-slash';
            } else {
                keyInput.type = 'password';
                eyeIcon.className = 'fa-solid fa-eye';
            }
        }

        async function handleFileSelect() {
            const fileInput = document.getElementById('pdfInput');
            if (!fileInput.files[0]) return;
            
            try {
                const arrayBuffer = await fileInput.files[0].arrayBuffer();
                const pdf = await pdfjsLib.getDocument(arrayBuffer).promise;
                const badge = document.getElementById('pageCountBadge');
                badge.innerText = `إجمالي الصفحات: ${pdf.numPages}`;
                badge.classList.remove('hidden');
                document.getElementById('endPage').value = Math.min(10, pdf.numPages);
            } catch(e) {
                console.error(e);
            }
        }

        // PDF Text Extraction
        async function extractPdfText() {
            const fileInput = document.getElementById('pdfInput');
            const startPage = parseInt(document.getElementById('startPage').value);
            const endPage = parseInt(document.getElementById('endPage').value);
            const status = document.getElementById('pdfStatus');

            if (!fileInput.files[0]) {
                alert("برجاء اختيار ملف PDF أولاً");
                return null;
            }

            status.classList.remove('hidden');
            status.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> جاري استخراج النص...`;

            try {
                const file = fileInput.files[0];
                const arrayBuffer = await file.arrayBuffer();
                const pdf = await pdfjsLib.getDocument(arrayBuffer).promise;

                let textContent = "";
                const finalEnd = Math.min(endPage, pdf.numPages);

                for (let i = startPage; i <= finalEnd; i++) {
                    const page = await pdf.getPage(i);
                    const text = await page.getTextContent();
                    const pageText = text.items.map(item => item.str).join(' ');
                    textContent += `\n--- [صفحة ${i}] ---\n` + pageText;
                }

                status.innerHTML = `<i class="fa-solid fa-check-circle"></i> تم جلب الصفحات (${startPage} - ${finalEnd})`;
                return textContent;
            } catch (err) {
                alert("حدث خطأ أثناء قراءة ملف PDF: " + err.message);
                return null;
            }
        }

        // Call Gemini API with Smart Multi-Model Fallback
       // Call Gemini API with Correct Endpoint & Fallback
async function callGemini(promptText, isJson = false) {
    const apiKey = document.getElementById('apiKey').value.trim();
    if (!apiKey) {
        alert("يرجى إدخال Gemini API Key أولاً!");
        return null;
    }

    // القائمة الصحيحة والمحدثة لنقاط الاتصال المعتمدة
    const modelsToTry = [
        "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent",
        "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent"
    ];

    const payload = {
        contents: [{ parts: [{ text: promptText }] }]
    };

    if (isJson) {
        payload.generationConfig = { responseMimeType: "application/json" };
    }

    let lastError = "";

    for (const endpoint of modelsToTry) {
        try {
            const response = await fetch(`${endpoint}?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const data = await response.json();

            if (response.ok && data.candidates && data.candidates[0]?.content?.parts[0]?.text) {
                return data.candidates[0].content.parts[0].text;
            } else if (data.error) {
                lastError = data.error.message;
            }
        } catch (err) {
            lastError = err.message;
        }
    }

    alert("فشل الاتصال بالذكاء الاصطناعي: " + lastError);
    return null;
}

        // Generate Exam
        async function generateExam() {
            const text = await extractPdfText();
            if (!text) return;

            showLoader("جاري صياغة وإنشاء الأسئلة بنموذج الذكاء الاصطناعي...");

            const qCount = document.getElementById('qCount').value;
            const difficulty = document.getElementById('difficulty').value;
            const qType = document.getElementById('qType').value;

            if (qType === 'mcq') {
                const prompt = `أنت معلم خبير ومصمم اختبارات ذكي. قم بقراءة النص التالي واستخراج اختبار من نوع اختيار من متعدد.
                عدد الأسئلة المطلوبة بالضبط: ${qCount}. مستوى الصعوبة: ${difficulty}.
                يجب أن تعيد الإجابة بصيغة JSON فقط كـ Array بدون أي نصوص خارجية:
                [
                  {
                    "id": 1,
                    "question": "نص السؤال هنا",
                    "options": ["خيار A", "خيار B", "خيار C", "خيار D"],
                    "correctAnswer": 0,
                    "explanation": "شرح تفصيلي ولماذا هذه الإجابة هي الصحيحة بناءً على النص",
                    "evidence": "الدليل المقتبس نصاً من النص المصدر"
                  }
                ]
                النص المصدر:
                ${text}`;

                const jsonResult = await callGemini(prompt, true);
                if (jsonResult) {
                    try {
                        const cleanJson = jsonResult.replace(/```json/g, '').replace(/```/g, '').trim();
                        currentExamData = JSON.parse(cleanJson);
                        userAnswers = {};
                        renderMCQExam(currentExamData);
                    } catch(e) {
                        alert("حدث خطأ أثناء تنسيق استجابة الاختبار.");
                    }
                }

            } else {
                const prompt = `أنت معلم خبير. قم بتوليد أسئلة مقالية واختبارات شرح وافية بناءً على النص التالي:
                عدد الأسئلة: ${qCount}. مستوى الصعوبة: ${difficulty}.
                قم بكتابة السؤال، والإجابة النموذجية مع الشرح والتحليل المباشر والدليل من النص.
                
                النص المصدر:
                ${text}`;

                const markdownResult = await callGemini(prompt, false);
                if (markdownResult) renderMarkdownText(markdownResult);
            }

            hideLoader();
        }

        // Render MCQ Interactive UI
        function renderMCQExam(data) {
            const area = document.getElementById('outputArea');
            area.innerHTML = `<h2 class="text-xl font-bold text-indigo-400 mb-6 flex items-center gap-2"><i class="fa-solid fa-list-check"></i> اختبار تفاعلي شامل (${data.length} سؤال)</h2>`;

            data.forEach((q, idx) => {
                const qCard = document.createElement('div');
                qCard.className = "bg-slate-800 p-5 rounded-xl border border-slate-700/80 mb-4 space-y-4 shadow-md";
                qCard.innerHTML = `
                    <p class="font-bold text-base text-slate-100 flex gap-2">
                        <span class="bg-indigo-900/80 text-indigo-300 text-xs px-2 py-1 rounded h-fit">${idx + 1}</span>
                        <span>${q.question}</span>
                    </p>
                    <div class="space-y-2" id="options-${idx}">
                        ${q.options.map((opt, oIdx) => `
                            <button id="opt-btn-${idx}-${oIdx}" onclick="checkAnswer(${idx}, ${oIdx}, ${q.correctAnswer}, '${encodeURIComponent(q.explanation)}', '${encodeURIComponent(q.evidence)}')" 
                                    class="w-full text-right p-3 rounded-lg bg-slate-700/60 hover:bg-slate-700 border border-slate-600 transition text-sm text-slate-200 flex items-center justify-between">
                                <span>${opt}</span>
                                <i class="fa-regular fa-circle text-slate-400 text-xs"></i>
                            </button>
                        `).join('')}
                    </div>
                    <div id="feedback-${idx}" class="hidden p-4 rounded-lg text-xs space-y-2"></div>
                `;
                area.appendChild(qCard);
            });

            document.getElementById('quizScoreBadge').classList.remove('hidden');
            updateScoreBadge();
            showOutput();
        }

        // Check Answer & Show Evidence
        function checkAnswer(qIdx, selectedIdx, correctIdx, encExp, encEv) {
            if (userAnswers[qIdx] !== undefined) return; // Prevent re-answering
            userAnswers[qIdx] = selectedIdx;

            const exp = decodeURIComponent(encExp);
            const ev = decodeURIComponent(encEv);
            
            const feedback = document.getElementById(`feedback-${qIdx}`);
            const optionsDiv = document.getElementById(`options-${qIdx}`);

            Array.from(optionsDiv.children).forEach((btn, oIdx) => {
                btn.classList.remove('hover:bg-slate-700');
                if (oIdx === correctIdx) {
                    btn.className = "w-full text-right p-3 rounded-lg bg-emerald-950/80 border border-emerald-500 text-sm text-emerald-200 font-semibold flex items-center justify-between";
                    btn.querySelector('i').className = "fa-solid fa-circle-check text-emerald-400";
                } else if (oIdx === selectedIdx) {
                    btn.className = "w-full text-right p-3 rounded-lg bg-rose-950/80 border border-rose-500 text-sm text-rose-200 flex items-center justify-between";
                    btn.querySelector('i').className = "fa-solid fa-circle-xmark text-rose-400";
                }
            });

            feedback.classList.remove('hidden');

            if (selectedIdx === correctIdx) {
                feedback.className = "p-4 rounded-lg text-xs bg-emerald-950/40 border border-emerald-800 text-emerald-200 space-y-1";
                feedback.innerHTML = `
                    <div class="font-bold text-emerald-400 flex items-center gap-1"><i class="fa-solid fa-circle-check"></i> إجابة صحيحة!</div>
                    <div><b>الشرح والتحليل:</b> ${exp}</div>
                `;
            } else {
                feedback.className = "p-4 rounded-lg text-xs bg-rose-950/40 border border-rose-800 text-rose-200 space-y-2";
                feedback.innerHTML = `
                    <div class="font-bold text-rose-400 flex items-center gap-1"><i class="fa-solid fa-circle-xmark"></i> إجابة خاطئة!</div>
                    <div><b>الشرح والتحليل:</b> ${exp}</div>
                    <div class="bg-rose-900/30 p-2 rounded border border-rose-800/50 text-[11px]"><b>الدليل المقتبس من الكتاب:</b> "${ev}"</div>
                `;
            }

            updateScoreBadge();
        }

        function updateScoreBadge() {
            const total = currentExamData.length;
            if (total === 0) return;
            let correct = 0;
            Object.keys(userAnswers).forEach(qIdx => {
                if (userAnswers[qIdx] === currentExamData[qIdx].correctAnswer) {
                    correct++;
                }
            });
            const pct = Math.round((correct / total) * 100);
            document.getElementById('scoreText').innerText = `${correct} من ${total} (${pct}%)`;
        }

        // Generate Summary
        async function generateSummary() {
            const text = await extractPdfText();
            if (!text) return;

            showLoader("جاري قراءة الكتاب وتكثيف الملخص وتقسيم الدروس...");

            const prompt = `أنت مساعد أكاديمي خبير. قم بتحليل النص المرفق وتقسيمه بشكل ذكي جداً إلى مواضيع ودروس رئيسية، ثم قدم ملخصاً شاملاً ومنظماً لكل جزء باستخدام النقاط والرموز التعبيرية والعناوين الجانبية.
            
            النص:
            ${text}`;

            const res = await callGemini(prompt, false);
            if (res) renderMarkdownText(res);
            hideLoader();
        }

        // Ask Custom AI Question
        async function askCustomAI() {
            const promptInput = document.getElementById('customPrompt').value;
            if (!promptInput) return alert("اكتب سؤالك أولاً!");

            const text = await extractPdfText();
            if (!text) return;

            showLoader("جاري الإجابة عن سؤالك واستخراج الشرح...");

            const fullPrompt = `بناءً على النص التالي من الكتاب، أجب على سؤال المستخدم بشكل دقيق وواضح مع الشرح:
            سؤال المستخدم: ${promptInput}
            
            النص المصدر:
            ${text}`;

            const res = await callGemini(fullPrompt, false);
            if (res) renderMarkdownText(res);
            hideLoader();
        }

        // UI Helpers
        function renderMarkdownText(text) {
            document.getElementById('quizScoreBadge').classList.add('hidden');
            const area = document.getElementById('outputArea');
            area.innerHTML = `<div class="prose prose-invert max-w-none space-y-4 leading-relaxed text-sm text-slate-200">${marked.parse(text)}</div>`;
            showOutput();
        }

        function showLoader(txt) {
            document.getElementById('loadingText').innerText = txt;
            document.getElementById('loader').classList.remove('hidden');
            document.getElementById('loader').classList.add('flex');
            document.getElementById('emptyState').classList.add('hidden');
            document.getElementById('outputArea').classList.add('hidden');
        }

        function hideLoader() {
            document.getElementById('loader').classList.add('hidden');
            document.getElementById('loader').classList.remove('flex');
        }

        function showOutput() {
            document.getElementById('outputArea').classList.remove('hidden');
            document.getElementById('outputToolbar').classList.remove('hidden');
            document.getElementById('outputToolbar').classList.add('flex');
            document.getElementById('emptyState').classList.add('hidden');
        }

        function resetWorkspace() {
            document.getElementById('outputArea').innerHTML = '';
            document.getElementById('outputArea').classList.add('hidden');
            document.getElementById('outputToolbar').classList.add('hidden');
            document.getElementById('emptyState').classList.remove('hidden');
            currentExamData = [];
            userAnswers = {};
        }

        function printOutput() {
            window.print();
        }
    </script>
</body>
</html>
